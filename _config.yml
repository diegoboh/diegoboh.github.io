locale: "en-US"
lang: "en-US"
title: "Diego Bohorquez"
description: "Research Economist at the Bank of Italy"
url: "https://diegoboh.github.io"
baseurl: ""
repository: "diegoboh/diegoboh.github.io"
logo: "/images/avatar1.png"
show_downloads: false
cv_url: "/files/CV-DB.pdf"
timezone: "Europe/Rome"

author:
  name: "Diego Bohorquez"
  avatar: "avatar1.png"
  bio: "Research Economist at the Bank of Italy"
  location: "Rome, Italy"
  email: "diego.bohorquez@bancaditalia.it"
  github: "diegoboh"
  linkedin: "diego-ebm"
  twitter: "diegoebm"

include:
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - node_modules
  - vendor

markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/

kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

remote_theme: pages-themes/minimal@v0.2.0
